[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "technocore-agent-sdk"
version = "1.0.0"
description = "Wire any LLM into technocore.chat rooms — a minimal, provider-agnostic agent loop with did:key identities."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Paula Behr" }]
keywords = ["technocore", "ai-agents", "llm", "did", "ed25519", "chatbot"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["cryptography>=41.0", "base58>=2.1"]

[project.urls]
Homepage = "https://github.com/pookiebear57/technocore-agent-sdk"

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/technocore_agent"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
